<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Admin</title>
    
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI',sans-serif;
    background:linear-gradient(
        135deg,
        #eaf3ff,
        #f4f7fb
    );
    min-height:100vh;
}

.login-container{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.card{
    width:100%;
    max-width:450px;
    background:white;
    padding:35px;
    border-radius:24px;
    text-align:center;

    box-shadow:
        0 15px 40px rgba(0,0,0,.08);
}

.logo{
    width:90px;
    margin-bottom:15px;
}

h2{
    color:#0f4c81;
    margin-bottom:5px;
}

.subtitle{
    color:#64748b;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #dbe3ec;
    border-radius:12px;
    margin-bottom:15px;
    font-size:14px;
    outline:none;
}

input:focus{
    border-color:#0f4c81;
}

.btn-login{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:#0f4c81;
    color:white;
    font-weight:600;
    cursor:pointer;
    transition:.2s;
}

.btn-login:hover{
    background:#1666ac;
}

.btn-back{
    display:block;
    margin-top:12px;
    padding:14px;
    border-radius:12px;
    text-decoration:none;
    background:#f1f5f9;
    color:#334155;
    font-weight:600;
    transition:.2s;
}

.btn-back:hover{
    background:#e2e8f0;
}

@media(max-width:576px){

    .card{
        padding:25px;
    }

}

   /* =========================
   LOADING
========================= */

#loadingOverlay{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;

    background:rgba(255,255,255,.85);

    display:none;
    justify-content:center;
    align-items:center;

    z-index:9999;
}

.loader{
    width:55px;
    height:55px;

    border:5px solid #dbeafe;
    border-top:5px solid #0f4c81;

    border-radius:50%;

    animation:spin .8s linear infinite;
}

@keyframes spin{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }

} 
</style>
</head>
<body>

<div class="login-container">

    <div class="card">

        <img
            src="assets/img/rsudbk.png"
            class="logo"
            alt="Logo">

        <h2>
            Login Admin
        </h2>

        <p class="subtitle">
            Management Peserta Didik
        </p>

        <input
            type="email"
            id="email"
            placeholder="Email Admin">

        <input
            type="password"
            id="password"
            placeholder="Password">

        <button
            class="btn-login"
            onclick="login()">

            Login

        </button>

        <a
            href="index.html"
            class="btn-back">

            ← Kembali ke Beranda

        </a>

    </div>

</div>

<!-- LOADING OVERLAY -->

<div id="loadingOverlay">

    <div class="loader"></div>

</div>    


<script type="module">

import { createClient }
from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

const supabase = createClient(
    'https://lleabupwwoacnhkgqrby.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxsZWFidXB3d29hY25oa2dxcmJ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwODcxMTMsImV4cCI6MjA5NTY2MzExM30.lROS6ezfc-SCo3tm0T_H3GU0rF-MCuiq1Fg5DuTZzl4'
)

const {
    data: { session }
} = await supabase.auth.getSession();

if (session) {
    location.replace('dashboard.html');
}

window.login = async () => {

    const email =
        document
            .getElementById('email')
            .value
            .trim();

    const password =
        document
            .getElementById('password')
            .value;

    if (!email || !password) {

        alert(
            'Email dan Password wajib diisi'
        );

        return;
    }

    // =====================
    // TAMPILKAN LOADING
    // =====================

    document
        .getElementById('loadingOverlay')
        .style.display = 'flex';

    const { error } =
        await supabase.auth
            .signInWithPassword({

                email,
                password

            });

    if (error) {

        document
            .getElementById('loadingOverlay')
            .style.display = 'none';

        alert(error.message);

        return;
    }

    location.replace(
        'dashboard.html'
    );
}
</script>

</body>
</html>
