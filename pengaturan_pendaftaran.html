<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Management Peserta Didik</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>

:root{
    --sidebar-bg:#0f4c81;
    --sidebar-hover:#1666ac;
    --primary:#0f4c81;
    --body-bg:#f4f7fb;
}

body{
    background:var(--body-bg);
    overflow-x:hidden;
}

/* ===========================
   SIDEBAR
=========================== */

.sidebar{
    position:fixed;
    left:0;
    top:0;
    width:260px;
    height:100vh;
    background:var(--sidebar-bg);
    color:white;
    transition:.3s;
    z-index:1000;
}

.sidebar.collapsed{
    width:80px;
}

.logo-area{
    padding:20px;
    text-align:center;
    border-bottom:1px solid rgba(255,255,255,.15);
}

.logo-area img{
    width:70px;
}

.logo-title{
    margin-top:10px;
    font-weight:600;
    font-size:15px;
    line-height:1.3;
}

.sidebar.collapsed .logo-title{
    display:none;
}

.menu{
    padding:15px 0;
}

.menu a{
    display:flex;
    align-items:center;
    gap:12px;
    color:white;
    text-decoration:none;
    padding:12px 20px;
    transition:.2s;
}

.menu a:hover{
    background:var(--sidebar-hover);
}

.menu i{
    font-size:20px;
}

.sidebar.collapsed .menu span{
    display:none;
}

/* ===========================
   MAIN
=========================== */

.main{
    margin-left:260px;
    transition:.3s;
}

.main.expanded{
    margin-left:80px;
}

.topbar{
    height:70px;
    background:white;
    box-shadow:0 2px 10px rgba(0,0,0,.05);
    display:flex;
    align-items:center;
    padding:0 20px;
}

.toggle-btn{
    border:none;
    background:none;
    font-size:24px;
    color:var(--primary);
}

.page-title{
    font-weight:600;
    color:#334155;
    margin-left:15px;
}

.content{
    padding:25px;
}

/* ===========================
   CARD
=========================== */

.stat-card{
    border:none;
    border-radius:18px;
    box-shadow:0 4px 20px rgba(0,0,0,.06);
}

.stat-icon{
    width:60px;
    height:60px;
    border-radius:14px;
    background:#e8f2fc;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
    color:var(--primary);
}

.stat-number{
    font-size:30px;
    font-weight:700;
}

.stat-label{
    color:#64748b;
}

/* ===========================
   INFO CARD
=========================== */

.info-card{
    border:none;
    border-radius:18px;
    box-shadow:0 4px 20px rgba(0,0,0,.06);
}

    .current-card{
    background:#f8fbff;
    border:2px solid #dbeafe;
}

.current-card p{
    margin-bottom:18px;
}

.current-card strong{
    color:#0f4c81;
}

    

.badge-open{
    background:#16a34a;
}

.badge-close{
    background:#dc2626;
}

/* ===========================
   MOBILE
=========================== */

@media(max-width:768px){

    .sidebar{
        left:-260px;
    }

    .sidebar.mobile-show{
        left:0;
    }

    .main{
        margin-left:0 !important;
    }

}

</style>

</head>
<body>

<!-- SIDEBAR -->

<div class="sidebar" id="sidebar">

    <div class="logo-area">
        <img src="assets/img/rsudbk.png" alt="Logo">
        <div class="logo-title">
            Management<br>
            Peserta Didik
        </div>
    </div>

    <div class="menu">

        <a href="dashboard.html">
            <i class="bi bi-house-door"></i>
            <span>Dashboard</span>
        </a>

        <a href="peserta.html">
            <i class="bi bi-people"></i>
            <span>Data Peserta</span>
        </a>

        <a href="pengaturan_pendaftaran.html">
            <i class="bi bi-gear"></i>
            <span>Pengaturan</span>
        </a>

        <a href="#" id="btnLogout">
            <i class="bi bi-box-arrow-right"></i>
            <span>Logout</span>
        </a>

    </div>

</div>

<!-- MAIN -->

<div class="main" id="main">

    <div class="topbar">

        <button class="toggle-btn" id="toggleSidebar">
            <i class="bi bi-list"></i>
        </button>

        <div class="page-title">
            Pengaturan Pendaftaran
        </div>

    </div>

        <div class="content">

            <div class="row">

                <div class="col-12 col-lg-8">

                    <div class="card info-card p-4">

                        <h5 class="mb-4">
                            ⚙️ Pengaturan Pendaftaran
                        </h5>

                        <div class="mb-3">
                            <input
                                type="text"
                                id="gelombang"
                                class="form-control"
                                list="gelombangList"
                                placeholder="Contoh: GEL8">

                            <datalist id="gelombangList"></datalist>
                        </div>
                        <div class="alert alert-info mt-3">

    Pilih atau ketik gelombang terlebih dahulu
    untuk mengaktifkan pengaturan waktu.

</div>

                        

                        <div class="mb-3">

                            <label class="form-label">
                                Buka Pendaftaran
                            </label>

                            <input
    type="datetime-local"
    id="buka"
    class="form-control"
    disabled>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Tutup Pendaftaran
                            </label>

                            <input
    type="datetime-local"
    id="tutup"
    class="form-control"
    disabled>

                        </div>

                        <button
                            class="btn btn-primary"
                            id="btnSimpan">

                            Simpan Pengaturan

                        </button>

                    </div>

                </div>

                <div class="col-12 col-lg-4 mt-3 mt-lg-0">

                    <div class="card info-card current-card p-4">

                        <h5 class="mb-3">
                            📋 Pengaturan Saat Ini
                        </h5>

                        <p>
                            <strong>Gelombang:</strong><br>
                            <span id="infoGelombang">-</span>
                        </p>

                        <p>
                            <strong>Status:</strong><br>
                            <span id="infoStatus">-</span>
                        </p>

                        <p>
                            <strong>Buka:</strong><br>
                            <span id="infoBuka">-</span>
                        </p>

                        <p>
                            <strong>Tutup:</strong><br>
                            <span id="infoTutup">-</span>
                        </p>

                    </div>

                </div>

            </div>

        </div>

</div>

<script type="module">

import { createClient }
from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

const supabase = createClient(
    'https://lleabupwwoacnhkgqrby.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxsZWFidXB3d29hY25oa2dxcmJ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwODcxMTMsImV4cCI6MjA5NTY2MzExM30.lROS6ezfc-SCo3tm0T_H3GU0rF-MCuiq1Fg5DuTZzl4'
);

// =====================================
// CEK SESSION LOGIN
// =====================================

const {
    data: { session }
} = await supabase.auth.getSession();

if (!session) {
    location.href = 'login.html';
}

// =====================================
// SIDEBAR
// =====================================

const sidebar = document.getElementById('sidebar');
const main = document.getElementById('main');

document
    .getElementById('toggleSidebar')
    .addEventListener('click', () => {

        if (window.innerWidth <= 768) {
            sidebar.classList.toggle('mobile-show');
        } else {
            sidebar.classList.toggle('collapsed');
            main.classList.toggle('expanded');
        }

    });

// =====================================
// LOGOUT
// =====================================

document
    .getElementById('btnLogout')
    .addEventListener('click', async (e) => {

        e.preventDefault();

        const konfirmasi = confirm(
            'Logout dari sistem?'
        );

        if (!konfirmasi) return;

        const { error } =
            await supabase.auth.signOut();

        if (error) {
            alert(error.message);
            return;
        }

        location.replace('index.html');

    });


    async function loadGelombang() {

    const { data, error } =
        await supabase
            .from('pesertadidik')
            .select('gelombang');

    if (error) return;

    const unik =
        [...new Set(
            data
                .map(x => x.gelombang)
                .filter(Boolean)
        )];

    const datalist =
        document.getElementById(
            'gelombangList'
        );

    datalist.innerHTML = '';

    unik.sort();

    unik.forEach(gel => {

        datalist.innerHTML += `
            <option value="${gel}">
        `;

    });

}

async function loadInfoPengaturan() {

    const { data, error } =
        await supabase
            .from('pengaturan_pendaftaran')
            .select('*')
            .eq('id', 1)
            .single();

    if (error) return;

    document
        .getElementById('infoGelombang')
        .innerText =
            data.gelombang;

    const buka =
        new Date(data.buka_pendaftaran);

    const tutup =
        new Date(data.tutup_pendaftaran);

    const sekarang =
        new Date();

    document
    .getElementById('infoBuka')
    .innerText =
        buka.toLocaleString('id-ID');

document
    .getElementById('infoTutup')
    .innerText =
        tutup.toLocaleString('id-ID');

    document
        .getElementById('infoStatus')
        .innerText =
            sekarang >= buka &&
            sekarang <= tutup
                ? '🟢 Dibuka'
                : '🔴 Ditutup';
}

await loadGelombang();
await loadInfoPengaturan();

   const gelombangInput =
    document.getElementById('gelombang');

gelombangInput.addEventListener(
    'input',
    () => {

        const adaIsi =
            gelombangInput.value.trim() !== '';

        document
            .getElementById('buka')
            .disabled = !adaIsi;

        document
            .getElementById('tutup')
            .disabled = !adaIsi;

    }
); 

// =====================================
// SIMPAN PENGATURAN
// =====================================

document
    .getElementById('btnSimpan')
    .addEventListener('click', async () => {

        const gelombang =
            document
                .getElementById('gelombang')
                .value
                .trim();

        const buka =
            document
                .getElementById('buka')
                .value;

        const tutup =
            document
                .getElementById('tutup')
                .value;

        if (!gelombang) {
            alert('Silakan pilih atau ketik gelombang');
            return;
        }

        if (!buka) {
            alert('Tanggal buka wajib diisi');
            return;
        }

        if (!tutup) {
            alert('Tanggal tutup wajib diisi');
            return;
        }

        if (new Date(buka) >= new Date(tutup)) {
            alert('Tanggal tutup harus setelah tanggal buka');
            return;
        }

        const btn =
            document.getElementById('btnSimpan');

        btn.disabled = true;
        btn.innerHTML = 'Menyimpan...';

        const { data, error } =
    await supabase
        .from('pengaturan_pendaftaran')
        .update({
            gelombang: gelombang,
            buka_pendaftaran: buka,
            tutup_pendaftaran: tutup,
            updated_at: new Date().toISOString()
        })
        .eq('id', 1)
        .select();

        console.log('HASIL UPDATE:', data);
        console.log('ERROR UPDATE:', error);

        btn.disabled = false;
        btn.innerHTML = 'Simpan Pengaturan';

        if (error) {
            console.error(error);

            alert(
                'Gagal menyimpan:\n' +
                error.message
            );

            return;
        }

        alert(
            '✅ Pengaturan berhasil disimpan'
        );

        // refresh card kanan
        await loadInfoPengaturan();

        // kosongkan form input
        document.getElementById('gelombang').value = '';
        document.getElementById('buka').value = '';
        document.getElementById('tutup').value = '';

    });

</script>

</body>
</html>
