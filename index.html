<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Management Peserta Didik</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --primary:#0f4c81;
    --primary-hover:#1666ac;
    --bg:#f4f7fb;
}

body{
    font-family:'Inter',sans-serif;
    background:linear-gradient(
        135deg,
        #eaf3ff 0%,
        #f4f7fb 100%
    );
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:600px;
}

.card{
    background:white;
    border-radius:24px;
    padding:40px;
    box-shadow:
        0 15px 40px rgba(0,0,0,.08);
    text-align:center;
}

.logo{
    width:110px;
    margin-bottom:20px;
}

h1{
    font-size:28px;
    color:#1e293b;
    margin-bottom:10px;
}

.subtitle{
    color:#64748b;
    margin-bottom:35px;
    line-height:1.6;
}

.menu{
    display:flex;
    flex-direction:column;
    gap:15px;
}

.menu a{
    text-decoration:none;
    background:#f8fafc;
    border:1px solid #e2e8f0;
    border-radius:16px;
    padding:18px 20px;
    color:#334155;
    font-weight:600;
    text-align:left;
    transition:.25s;
}

.menu a:hover{
    background:#eff6ff;
    border-color:var(--primary);
    color:var(--primary);
    transform:translateY(-3px);
}

.footer{
    margin-top:25px;
    font-size:13px;
    color:#94a3b8;
}

@media(max-width:576px){

    .card{
        padding:30px 20px;
    }

    h1{
        font-size:24px;
    }

}

</style>
</head>
<body>

<div class="container">

    <div class="card">

        <img
            src="assets/img/rsudbk.png"
            class="logo"
            alt="Logo">

        <h1>
            Management Peserta Didik
        </h1>

        <div class="subtitle">
            Sistem Informasi Pendaftaran dan
            Manajemen Data Peserta Didik
        </div>

        <div class="menu">

            <a href="dashboard.html">
                📊 Dashboard Admin
            </a>

            <a href="pendaftaran.html">
                📝 Pendaftaran Peserta Didik
            </a>

            <a href="peserta.html">
                👥 Data Peserta Didik
            </a>

        </div>

        <div class="footer">
            RSUD Bandung Kiwari<br>
            Management Peserta Didik
        </div>

    </div>

</div>

</body>
</html>
